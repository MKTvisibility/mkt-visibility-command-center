name: Publish Command Center
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
      # Browser-safe public configuration. No secret/service-role key.
      VITE_SUPABASE_URL: https://gvmwkltwrlqwbqegieum.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SFIrQ_kqkLQJdBNMnaRr3g_w6XWKaBJ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
